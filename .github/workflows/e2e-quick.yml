# Fork-only experiment. Reuses a registered dispatch path on this proof branch;
# neither the fork's default workflow nor NVKR's generated workflows are changed.
name: Mkosi full VM runtime proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mkosi-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  proof:
    if: github.repository == 'njhensley/nvkr' && github.ref == 'refs/heads/fm/mkosi-runner-proof'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Acquire exact mkosi probe input
        shell: bash
        run: |
          set -euo pipefail
          proof_root="$RUNNER_TEMP/mkosi-runtime"
          mkdir -p "$proof_root/tools"
          curl --fail --location --connect-timeout 10 --max-time 60 \
            --retry 2 --retry-delay 3 --retry-max-time 180 --max-filesize 353958 \
            https://snapshot.ubuntu.com/ubuntu/20261109T000000Z/pool/universe/m/mkosi/mkosi_26-3_all.deb \
            --output "$proof_root/mkosi.deb"
          echo "1f43afbe19de3f1a16f74de67aaa4e449b8bf06b81f5bec4e460d1e20afc5552  $proof_root/mkosi.deb" | sha256sum --check
          dpkg-deb --extract "$proof_root/mkosi.deb" "$proof_root/tools"
      - name: Acquire and verify both snapshot package closures
        shell: bash
        run: |
          set -euo pipefail
          sudo systemd-run --quiet --wait --pipe --collect \
            --unit="mkosi-acquire-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --property=PrivateDevices=yes --property=RuntimeMaxSec=1200 \
            /usr/bin/python3 \
            "$GITHUB_WORKSPACE/scripts/mkosi-runtime-proof.py" acquire \
            --root "$RUNNER_TEMP/mkosi-runtime" \
            --pins "$GITHUB_WORKSPACE/inputs/proofs/mkosi-runtime/pins.json"
      - name: Assemble twice without network or KVM
        shell: bash
        run: |
          set -euo pipefail
          proof_root="$RUNNER_TEMP/mkosi-runtime"
          for attempt in 1 2; do
            sudo systemd-run --quiet --wait --pipe --collect \
              --unit="mkosi-runtime-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$attempt" \
              --property=MemoryAccounting=yes \
              --property=PrivateDevices=yes \
              --property=PrivateNetwork=yes \
              --property=RuntimeMaxSec=1200 \
              /usr/bin/python3 "$GITHUB_WORKSPACE/scripts/mkosi-runtime-proof.py" build \
              --module "$proof_root/tools/usr/lib/python3/dist-packages" \
              --pins "$GITHUB_WORKSPACE/inputs/proofs/mkosi-runtime/pins.json" \
              --root "$proof_root" --attempt "$attempt"
          done
          sudo /usr/bin/python3 "$GITHUB_WORKSPACE/scripts/mkosi-runtime-proof.py" compare \
            --root "$proof_root" \
            --pins "$GITHUB_WORKSPACE/inputs/proofs/mkosi-runtime/pins.json"
      - name: Make proof records readable
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d "$RUNNER_TEMP/mkosi-runtime/records" ]]; then
            sudo chmod -R a+rX "$RUNNER_TEMP/mkosi-runtime/records"
          fi
      - name: Retain text records only, never runtime binaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mkosi-runtime-records-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mkosi-runtime/records/*.json
            ${{ runner.temp }}/mkosi-runtime/records/*.log
          if-no-files-found: error
          retention-days: 7
